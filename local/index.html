<body>
<header><div class="brand"><i>S</i>SpaceLens<small>完全本地 · macOS 磁盘分析器</small></div><div class="privacy">● 数据不会离开此 Mac</div></header>
<section class="hero"><h1>本机存储空间</h1><p>选择磁盘或文件夹开始扫描；扫描过程中可随时停止。</p></section>
<section class="drives" id="drives"></section>
<main class="layout">
  <section class="panel">
    <div class="panel-head">
      <div class="crumbs" id="crumbs">尚未扫描</div>
      <div class="path-scan"><input id="path" readonly placeholder="请选择要扫描的目录"><button id="chooseBtn" class="choose" onclick="chooseFolder()">选择目录…</button><button onclick="scanPath()">开始扫描</button></div>
    </div>
    <div id="historyBanner" class="history-banner"><span id="historyText"></span><button onclick="clearHistoryView()">关闭提示</button></div>
    <div class="toolbar">
      <input id="search" placeholder="搜索当前目录中的文件或文件夹…" oninput="render()">
      <select id="kindFilter" onchange="render()"><option value="all">全部项目</option><option value="folder">仅文件夹</option><option value="file">仅文件</option></select>
      <select id="typeFilter" onchange="render()"><option value="all">全部类型</option></select>
      <select id="sortBy" onchange="render()"><option value="size">按大小排序</option><option value="name">按名称排序</option><option value="type">按类型排序</option></select>
      <div class="view-switch"><button id="viewOverview" onclick="setView('overview')">概览</button><button id="viewTreemap" class="active" onclick="setView('treemap')">矩形</button><button id="viewList" onclick="setView('list')">列表</button><button id="viewBars" onclick="setView('bars')">条形</button><button id="viewLargest" onclick="setView('largest')">最大文件</button><button id="viewSearch" onclick="setView('search')">全局搜索</button></div>

</main>
<div class="progress" id="progress"><div><b>正在读取磁盘…</b><br><small id="progressText"></small></div><b id="progressSize"></b><button class="stop" onclick="cancelScan()">停止扫描</button></div>

    </div>
  </section>
</div>
<script>
const colors=['#637dff','#8d63ff','#42b8a8','#e46696','#e2a442','#4e9be6','#45b77c','#6b788d'];
let result=null,current=null,history=[],ascending=false,activeSnapshotId=null,toastTimer=null,viewMode='treemap',treeDepth='1',dupPollTimer=null,flatViewRows=[],cascadeGroups=[],expandedMapNodes=[],mapRenderCount=0,mapLimitHit=false,overviewGroups=[],overviewExpanded=new Set(),overviewExpandAllActive=false,overviewTouched=false,overviewScopeKey='',globalFileRows=[],globalSearchRows=[],globalSearchQuery='',globalSearchMode='name',globalLargestMode='list',largestCacheKey='',largestCache=null,fileViewToken=0;
const el=id=>document.getElementById(id);
const fmt=n=>n>=1099511627776?(n/1099511627776).toFixed(2)+' TB':n>=1073741824?(n/1073741824).toFixed(1)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(1)+' KB':n+' B';
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadDrives(){const ds=await fetch('/api/drives').then(r=>r.json());el('drives').innerHTML=ds.map(d=>`<button class="drive" onclick="start(${JSON.stringify(d.path)})"><b>${d.is_network?'网络共享':'本地磁盘'} (${esc(d.path)})</b>${d.remote?`<small title="${esc(d.remote)}">${esc(d.remote)}</small>`:''}<small>${fmt(d.used)} / ${fmt(d.total)} · ${Math.round(d.used/d.total*100)}% 已用${d.is_network?'（底层卷容量）':''}</small><div class="bar"><i style="width:${d.used/d.total*100}%"></i></div></button>`).join('')}
async function start(scanPath){const response=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:scanPath})});const data=await response.json();if(!response.ok)return alert(data.error||'无法开始扫描');clearHistoryView();el('progress').classList.add('show');poll()}
function scanPath(){if(el('path').value.trim())start(el('path').value.trim());else alert('请先选择目录')}
async function chooseFolder(){el('chooseBtn').disabled=true;el('chooseBtn').textContent='等待选择…';try{const data=await fetch('/api/pick-folder').then(r=>r.json());if(data.error)throw new Error(data.error);if(data.path)el('path').value=data.path}catch(e){alert('无法打开目录选择窗口：'+e.message)}finally{el('chooseBtn').disabled=false;el('chooseBtn').textContent='选择目录…'}}
async function cancelScan(){el('progressText').textContent='正在停止，请稍候…';await fetch('/api/cancel',{method:'POST'})}
async function poll(){const s=await fetch('/api/status').then(r=>r.json());el('files').textContent=s.files.toLocaleString();el('folders').textContent=s.folders.toLocaleString();el('progressText').textContent=`${s.files.toLocaleString()} 个文件 · ${s.folders.toLocaleString()} 个文件夹`;el('progressSize').textContent=fmt(s.bytes);if(s.running)return setTimeout(poll,500);el('progress').classList.remove('show');if(s.cancelled)return showToast('扫描已停止');if(s.error)return alert(s.error);result=s.result;current=result.root;history=[current];resetGlobalFileViews();fillTypes();render();renderSide();await loadSnapshotList();showToast('扫描完成，已自动保存为历史快照')}
async function saveSnapshot(){if(!result)return alert('请先完成一次扫描');const suggested=(history[0]?.name||'磁盘扫描')+' '+new Date().toLocaleDateString();const name=prompt('给这次扫描起一个名称：',suggested);if(name===null)return;const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const data=await response.json();if(!response.ok)return alert(data.error||'保存失败');activeSnapshotId=data.id;await loadSnapshotList();showToast('已保存，可在右侧“历史扫描时间点”中重新打开')}
async function loadSnapshotList(){const items=await fetch('/api/snapshots').then(r=>r.json());el('savedList').innerHTML=items.length?items.map(s=>`<div class="saved-row ${s.id===activeSnapshotId?'active':''}"><div class="saved-info"><b>${s.automatic?'◷ ':''}${esc(s.name)}</b><small>${new Date(s.created*1000).toLocaleString()} · ${fmt(s.bytes)}</small><small title="${esc(s.path||'')}">${esc(s.path||'')}</small></div><button class="open" onclick="openSnapshot('${s.id}',this)">打开</button><button class="delete" title="删除记录" onclick="deleteSnapshot('${s.id}')">×</button></div>`).join(''):'<div class="saved-empty">每次扫描完成后会自动保存</div>'}
async function openSnapshot(id,button){const oldText=button?.textContent;if(button){button.disabled=true;button.textContent='加载中…'}showToast('正在打开历史扫描…');try{const response=await fetch('/api/snapshot?id='+encodeURIComponent(id));const payload=await response.json();if(payload.error)return alert(payload.error);result=payload.result;current=result.root;history=[current];activeSnapshotId=id;resetGlobalFileViews();treeDepth='1';el('treeDepth').value='1';syncDepthButton();el('files').textContent=(payload.meta.files||0).toLocaleString();el('folders').textContent=(payload.meta.folders||0).toLocaleString();el('search').value='';fillTypes();render();renderSide();el('historyText').textContent=`正在查看：${payload.meta.name} · ${new Date(payload.meta.created*1000).toLocaleString()}`;el('historyBanner').classList.add('show');await loadSnapshotList();showToast('历史扫描结果已打开；需要时可一键展开全部')}catch(error){alert('打开历史记录失败：'+error.message)}finally{if(button){button.disabled=false;button.textContent=oldText}}}
async function deleteSnapshot(id){if(!confirm('删除这条本地扫描记录？'))return;await fetch('/api/delete-snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});loadSnapshotList()}
function clearHistoryView(){activeSnapshotId=null;el('historyBanner').classList.remove('show');loadSnapshotList()}
function showToast(message){el('toast').textContent=message;el('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').classList.remove('show'),3200)}
function resetGlobalFileViews(){globalSearchRows=[];globalSearchQuery='';largestCache=null;largestCacheKey='';fileViewToken++;overviewScopeKey=''}
function openDuplicates(){if(!current)return alert('请先完成扫描或打开一条历史记录');el('duplicateScope').textContent='范围：'+current.path;el('duplicateModal').classList.add('show')}
function closeDuplicates(){el('duplicateModal').classList.remove('show')}
async function startDuplicates(){const methods=[];if(el('dupQuick').checked)methods.push('quick');if(el('dupSha').checked)methods.push('sha256');if(el('dupByte').checked)methods.push('byte');const response=await fetch('/api/duplicates/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current.path,methods,min_size:Number(el('dupMinSize').value)})});const data=await response.json();if(!response.ok)return alert(data.error||'无法开始查重');el('dupProgress').classList.add('show');el('dupSummary').classList.remove('show');el('dupResults').innerHTML='';pollDuplicates()}
async function cancelDuplicates(){await fetch('/api/duplicates/cancel',{method:'POST'});el('dupPhase').textContent='正在停止…'}
async function pollDuplicates(){clearTimeout(dupPollTimer);const state=await fetch('/api/duplicates/status').then(r=>r.json());el('dupPhase').textContent=state.phase||'准备中…';el('dupProgressText').textContent=`已检查 ${Number(state.files||0).toLocaleString()} 个文件 · 候选 ${Number(state.candidates||0).toLocaleString()} 个`;if(state.running){dupPollTimer=setTimeout(pollDuplicates,600);return}el('dupProgress').classList.remove('show');if(state.cancelled)return showToast('重复文件检测已停止');if(state.error)return alert('查重失败：'+state.error);renderDuplicateResults(state)}
function renderDuplicateResults(state){const groups=state.result||[],fileCount=groups.reduce((sum,g)=>sum+g.paths.length,0),methods=state.methods||[],confidence=methods.includes('byte')?'逐字节确认':methods.includes('sha256')?'SHA-256 确认':methods.includes('quick')?'快速指纹候选':'仅大小相同候选';el('dupGroups').textContent=Number(state.groups||0).toLocaleString();el('dupFiles').textContent=fileCount.toLocaleString();el('dupReclaim').textContent=fmt(state.reclaimable||0);el('dupSummary').classList.add('show');const shown=groups.slice(0,100);el('dupResults').innerHTML=shown.length?shown.map((group,index)=>`<section class="dup-group"><div class="dup-group-head"><b>重复组 ${index+1} · ${fmt(group.size)}</b><span class="confidence">${confidence} · 可释放 ${fmt(group.reclaimable)}</span></div>${group.paths.map((path,i)=>`<label class="dup-file"><input type="checkbox" ${i?'checked':''}><span title="${esc(path)}">${esc(path)}</span><small>${i?'副本':'默认保留'}</small></label>`).join('')}</section>`).join('')+(groups.length>100?`<div class="saved-empty">结果较多，当前显示最大的 100 组，共 ${groups.length.toLocaleString()} 组。</div>`:''):'<div class="saved-empty">没有发现符合当前检测方式的重复文件。</div>';showToast(`查重完成：发现 ${state.groups||0} 组重复文件`)}
function fillTypes(){const values=['all',...new Set(result.types.map(t=>t.ext))];el('typeFilter').innerHTML=values.map(v=>`<option value="${esc(v)}">${v==='all'?'全部类型':esc(v)}</option>`).join('')}
function nodeKind(n){return n.kind||(n.ext?'file':'folder')}
function compareNodes(a,b){const sort=el('sortBy').value;let v=sort==='size'?a.size-b.size:sort==='type'?(a.ext||'文件夹').localeCompare(b.ext||'文件夹','zh-CN'):a.name.localeCompare(b.name,'zh-CN',{numeric:true});return ascending?v:-v}
function sortedChildren(node){return(node.children||[]).slice().sort(compareNodes)}
function visibleNodes(){if(!current)return[];const q=el('search').value.trim().toLowerCase(),kind=el('kindFilter').value,type=el('typeFilter').value;return current.children.filter(n=>(!q||n.name.toLowerCase().includes(q))&&(kind==='all'||nodeKind(n)===kind)&&(type==='all'||n.ext===type)).sort(compareNodes)}
function tileColor(node){const key=nodeKind(node)==='folder'?'folder:'+node.name:'file:'+node.ext;let hash=0;for(let i=0;i<key.length;i++)hash=((hash<<5)-hash)+key.charCodeAt(i);return colors[Math.abs(hash)%colors.length]}
function squarify(nodes,width,height){const weighted=nodes.filter(n=>n.size>0).map(node=>({node,area:node.size}));const total=weighted.reduce((s,i)=>s+i.area,0)||1;weighted.forEach(i=>i.area=i.area/total*width*height);let rect={x:0,y:0,w:width,h:height},row=[],output=[];const rowSum=r=>r.reduce((s,i)=>s+i.area,0);const worst=(r,side)=>{if(!r.length||side<=0)return Infinity;const sum=rowSum(r),values=r.map(i=>i.area),max=Math.max(...values),min=Math.max(Math.min(...values),.0001);return Math.max(side*side*max/(sum*sum),sum*sum/(side*side*min))};const place=r=>{const sum=rowSum(r);if(rect.w>=rect.h){const w=sum/Math.max(rect.h,.0001);let y=rect.y;r.forEach(i=>{const h=i.area/Math.max(w,.0001);output.push({node:i.node,x:rect.x,y,w,h});y+=h});rect={x:rect.x+w,y:rect.y,w:Math.max(0,rect.w-w),h:rect.h}}else{const h=sum/Math.max(rect.w,.0001);let x=rect.x;r.forEach(i=>{const w=i.area/Math.max(h,.0001);output.push({node:i.node,x,y:rect.y,w,h});x+=w});rect={x:rect.x,y:rect.y+h,w:rect.w,h:Math.max(0,rect.h-h)}}};for(const item of weighted){const side=Math.min(rect.w,rect.h);if(!row.length||worst([...row,item],side)<=worst(row,side))row.push(item);else{place(row);row=[item]}}if(row.length)place(row);return output}
function render(){if(!current)return;el('size').textContent=fmt(current.size);el('crumbs').innerHTML=history.map((n,i)=>`<button onclick="jump(${i})">${esc(n.name)}</button>${i<history.length-1?' › ':''}`).join('');const tree=el('tree');if(viewMode==='largest')return renderLargestFiles(tree);if(viewMode==='search')return renderGlobalSearch(tree);const nodes=visibleNodes();el('resultCount').textContent=`${nodes.length} 项`;if(!nodes.length){tree.className='empty';tree.innerHTML='没有符合筛选条件的项目';return}if(viewMode==='overview')return renderOverview(tree,nodes);if(viewMode==='list')return renderList(tree,nodes);if(viewMode==='bars')return renderBars(tree,nodes);renderTreemap(tree,nodes)}
function maxDepth(){return treeDepth==='all'?Infinity:Number(treeDepth)}
function matchesFilters(n){const q=el('search').value.trim().toLowerCase(),kind=el('kindFilter').value,type=el('typeFilter').value;return(!q||n.name.toLowerCase().includes(q))&&(kind==='all'||nodeKind(n)===kind)&&(type==='all'||n.ext===type)}
function flattenHierarchy(nodes){const rows=[],limit=maxDepth(),stack=[];for(let i=nodes.length-1;i>=0;i--)stack.push({node:nodes[i],level:1});while(stack.length){const row=stack.pop(),n=row.node;if(matchesFilters(n))rows.push(row);if(nodeKind(n)==='folder'&&n.children?.length&&row.level<limit){const children=sortedChildren(n);for(let i=children.length-1;i>=0;i--)stack.push({node:children[i],level:row.level+1})}}return rows}
function groupedHierarchy(nodes){const rows=[],limit=maxDepth();for(const root of nodes){rows.push({node:root,level:1,isGroup:true});if(nodeKind(root)!=='folder'||!root.children?.length||limit<=1)continue;const children=sortedChildren(root),stack=[];for(let i=children.length-1;i>=0;i--)stack.push({node:children[i],level:2});while(stack.length){const row=stack.pop(),n=row.node;if(matchesFilters(n))rows.push(row);if(nodeKind(n)==='folder'&&n.children?.length&&row.level<limit){const nested=sortedChildren(n);for(let i=nested.length-1;i>=0;i--)stack.push({node:nested[i],level:row.level+1})}}}return rows}
function setupVirtual(tree,rows,rowHeight,renderer,className){tree.className='virtual-tree '+className;tree.innerHTML='<div class="virtual-spacer"><div class="virtual-window"></div></div>';const spacer=tree.querySelector('.virtual-spacer'),windowEl=tree.querySelector('.virtual-window'),logicalHeight=rows.length*rowHeight,physicalHeight=Math.min(logicalHeight,16000000),scaled=logicalHeight>physicalHeight;spacer.style.height=physicalHeight+'px';const draw=()=>{const count=Math.ceil(tree.clientHeight/rowHeight)+16,maxStart=Math.max(0,rows.length-count),maxScroll=Math.max(1,physicalHeight-tree.clientHeight),start=scaled?Math.max(0,Math.min(maxStart,Math.floor(tree.scrollTop/maxScroll*maxStart))):Math.max(0,Math.floor(tree.scrollTop/rowHeight)-8),end=Math.min(rows.length,start+count),offset=scaled?Math.min(tree.scrollTop,Math.max(0,physicalHeight-(end-start)*rowHeight)):start*rowHeight;windowEl.style.transform=`translateY(${offset}px)`;windowEl.innerHTML=rows.slice(start,end).map((row,rowOffset)=>renderer(row,start+rowOffset)).join('')};tree.onscroll=draw;draw()}
function addMapNode(node){expandedMapNodes.push(node);return expandedMapNodes.length-1}
function overviewChildren(node){const children=sortedChildren(node);if(children.length<=12)return children.map(node=>({node,aggregate:false}));const shown=children.slice(0,11).map(node=>({node,aggregate:false})),rest=children.slice(11);shown.push({node:{name:`其他 ${rest.length.toLocaleString()} 项`,size:rest.reduce((sum,node)=>sum+node.size,0),kind:'aggregate',path:node.path},aggregate:true});return shown}
function renderOverviewMap(groupIndex,width,height){const group=overviewGroups[groupIndex],items=group.displayChildren;if(!items.length)return'<div class="overview-empty">这个目录没有可显示的下一层项目</div>';const boxes=squarify(items.map(item=>item.node),width,height);return `<div class="overview-map">${boxes.map(({node:n,x,y,w,h})=>{const itemIndex=items.findIndex(item=>item.node===n),item=items[itemIndex],density=w<26||h<20?'tiny':w<85||h<48?'compact':'',kind=item.aggregate?'file':nodeKind(n),action=item.aggregate?'':`onclick="openOverviewChild(${groupIndex},${itemIndex})"`;return `<button class="tile ${kind} ${density}" ${action} ${item.aggregate?'disabled':''} title="${esc(n.name)} · ${fmt(n.size)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:linear-gradient(145deg,${tileColor(n)},#172441)"><b>${esc(n.name)}</b><small>${fmt(n.size)}</small><em>${item.aggregate?'合并显示':kind==='folder'?(n.children?.length||0)+' 项':esc(n.ext||'')}</em></button>`}).join('')}</div>`}
function renderOverview(tree,nodes){tree.className='overview-view';tree.onscroll=null;const scopeKey=`${activeSnapshotId||'current'}|${current.path}`;if(overviewScopeKey!==scopeKey){overviewScopeKey=scopeKey;overviewExpanded.clear();overviewExpandAllActive=false;overviewTouched=false}overviewGroups=nodes.map(node=>({node,displayChildren:overviewChildren(node)}));const expandable=overviewGroups.filter(group=>group.displayChildren.length);if(overviewExpandAllActive)expandable.forEach(group=>overviewExpanded.add(group.node.path));else if(!overviewTouched&&!overviewExpanded.size){const first=expandable[0];if(first)overviewExpanded.add(first.node.path)}const width=Math.max(tree.clientWidth-28,280),height=205;let html=`<div class="overview-top"><span>一级目录按容量排序；每次只展示下一层，小项目自动合并</span><button onclick="toggleAllOverviewGroups()">${overviewExpandAllActive?'取消展开全部一级目录':'展开全部一级目录'}</button></div>`;html+=overviewGroups.map((group,index)=>{const n=group.node,count=n.children?.length||0,pct=current.size?n.size/current.size*100:0,expanded=overviewExpanded.has(n.path),canEnter=nodeKind(n)==='folder'&&count>0;return `<section class="overview-section"><div class="overview-head"><div class="overview-copy"><b>${esc(n.name)}<i>|</i>${fmt(n.size)}</b><span>${count.toLocaleString()} 个直接项目<i>|</i>${pct.toFixed(1)}%</span></div><div class="overview-actions">${group.displayChildren.length?`<button onclick="toggleOverviewGroup(${index})">${expanded?'收起':'展开'}</button>`:''}${canEnter?`<button onclick="openOverviewRoot(${index})">进入</button>`:''}</div></div><div class="overview-usage"><i style="width:${Math.min(100,pct)}%"></i></div>${expanded?renderOverviewMap(index,width,height):''}</section>`}).join('');tree.innerHTML=html;el('resultCount').textContent=`${nodes.length.toLocaleString()} 个一级项目 · 新概览`}
function toggleOverviewGroup(index){const path=overviewGroups[index]?.node?.path;if(!path)return;overviewTouched=true;overviewExpandAllActive=false;if(overviewExpanded.has(path))overviewExpanded.delete(path);else overviewExpanded.add(path);render()}
function toggleAllOverviewGroups(){overviewTouched=true;overviewExpandAllActive=!overviewExpandAllActive;if(overviewExpandAllActive)overviewGroups.filter(group=>group.displayChildren.length).forEach(group=>overviewExpanded.add(group.node.path));else overviewExpanded.clear();render()}
function openOverviewRoot(index){overviewExpanded.clear();openDirectNode(overviewGroups[index]?.node)}
function openOverviewChild(groupIndex,itemIndex){const item=overviewGroups[groupIndex]?.displayChildren?.[itemIndex];if(item&&!item.aggregate){overviewExpanded.clear();openDirectNode(item.node)}}
function renderGlobalFileRows(container,rows){if(!rows.length){container.className='global-file-results';container.innerHTML='<div class="file-empty">没有找到符合条件的文件</div>';return}globalFileRows=rows;setupVirtual(container,rows,48,(file,index)=>`<div class="global-file-row"><span class="global-file-rank">${(index+1).toLocaleString()}</span><div class="global-file-name"><b>${esc(file.name)}</b><small title="${esc(file.path)}">${esc(file.path)}</small></div><span class="global-file-ext">${esc(file.ext||'文件')}</span><b class="global-file-size">${fmt(file.size)}</b><div class="file-row-actions"><button class="open-folder-btn" onclick="openContainingFolder(${index})">打开文件夹</button><button class="copy-path-btn" onclick="copyFilePath(${index},event)">复制路径</button></div></div>`,'global-file-results')}
function renderLargestBars(container,rows){if(!rows.length)return renderGlobalFileRows(container,rows);globalFileRows=rows;const largest=Math.max(rows[0]?.size||1,1);setupVirtual(container,rows,52,(file,index)=>`<div class="largest-bar-row"><div class="largest-bar-label"><b>${esc(file.name)}</b><small title="${esc(file.path)}">${esc(file.path)}</small></div><div class="largest-bar-track"><i class="largest-bar-fill" style="width:${file.size/largest*100}%;background:${tileColor(file)}"></i></div><b class="global-file-size">${fmt(file.size)}</b><div class="file-row-actions"><button class="open-folder-btn" onclick="openContainingFolder(${index})">打开文件夹</button><button class="copy-path-btn" onclick="copyFilePath(${index},event)">复制路径</button></div></div>`,'global-file-results')}
function renderLargestTreemap(container,rows){globalFileRows=rows;if(!rows.length){container.className='global-file-results';container.innerHTML='<div class="file-empty">没有可显示的文件</div>';return}const shown=rows.slice(0,300);container.className='';container.innerHTML=`<div class="largest-treemap-note">矩形面积代表文件大小；为保证可读性显示最大的 ${shown.length.toLocaleString()} 个文件。点击矩形打开所在文件夹，大矩形内可直接复制路径。</div><div class="largest-treemap" id="largestTreemap"></div>`;const map=el('largestTreemap'),boxes=squarify(shown,Math.max(map.clientWidth,1),Math.max(map.clientHeight,1));map.innerHTML=boxes.map(({node:file,x,y,w,h})=>{const index=rows.indexOf(file),density=w<26||h<20?'tiny':w<88||h<48?'compact':'',copy=w>=120&&h>=70?`<button class="tile-copy" onclick="copyFilePath(${index},event)">复制路径</button>`:'';return `<div class="tile file ${density}" onclick="openContainingFolder(${index})" title="${esc(file.name)} · ${fmt(file.size)}&#10;点击打开所在文件夹&#10;${esc(file.path)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:linear-gradient(145deg,${tileColor(file)},#172441)"><b>${esc(file.name)}</b><small>${fmt(file.size)}</small><em>${esc(file.ext||'')}</em>${copy}</div>`}).join('')}
function renderLargestContent(container,rows){if(globalLargestMode==='bars')return renderLargestBars(container,rows);if(globalLargestMode==='treemap')return renderLargestTreemap(container,rows);renderGlobalFileRows(container,rows)}
function setLargestMode(mode){globalLargestMode=mode;renderLargestFiles(el('tree'))}
async function openContainingFolder(index){const file=globalFileRows[index];if(!file)return;try{const response=await fetch('/api/open-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:file.path})}),data=await response.json();if(!response.ok)throw new Error(data.error||'无法打开文件夹');showToast('已打开文件所在文件夹')}catch(error){alert(error.message)}}
async function copyFilePath(index,event){event?.stopPropagation();const file=globalFileRows[index];if(!file)return;try{await navigator.clipboard.writeText(file.path)}catch(error){const input=document.createElement('textarea');input.value=file.path;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();document.execCommand('copy');input.remove()}showToast('文件路径已复制')}
function fileIndexNote(complete){return complete?'完整文件索引':'旧快照索引可能不完整；重新扫描后可建立完整文件索引'}
function renderLargestFiles(tree){tree.className='file-view';tree.onscroll=null;tree.innerHTML=`<div class="file-view-head"><div><b>全局最大文件</b><br><span>扫描范围内所有文件按大小从大到小排列</span></div><div class="file-view-head-right"><div class="largest-modes"><button class="${globalLargestMode==='list'?'active':''}" onclick="setLargestMode('list')">列表</button><button class="${globalLargestMode==='bars'?'active':''}" onclick="setLargestMode('bars')">条形</button><button class="${globalLargestMode==='treemap'?'active':''}" onclick="setLargestMode('treemap')">矩形</button></div><span id="fileViewStatus">正在读取文件索引…</span></div></div><div id="globalFileResults" class="global-file-results"><div class="file-empty">正在加载…</div></div>`;const key=`${activeSnapshotId||'current'}|${result.root.path}|${result.root.size}`,container=el('globalFileResults'),status=el('fileViewStatus');el('resultCount').textContent='全局最大文件';if(largestCache&&largestCacheKey===key){renderLargestContent(container,largestCache.items);status.textContent=`${largestCache.items.length.toLocaleString()} 个文件 · ${fileIndexNote(largestCache.complete)}`;return}const token=++fileViewToken;fetch('/api/files/largest?snapshot_id='+encodeURIComponent(activeSnapshotId||'')+'&limit=1000').then(response=>response.json().then(data=>({ok:response.ok,data}))).then(({ok,data})=>{if(token!==fileViewToken||viewMode!=='largest')return;if(!ok)throw new Error(data.error||'读取失败');largestCacheKey=key;largestCache=data;renderLargestContent(container,data.items||[]);status.textContent=`${(data.items||[]).length.toLocaleString()} 个文件 · ${fileIndexNote(data.complete)}`}).catch(error=>{if(token!==fileViewToken||viewMode!=='largest')return;const fallback=(result.largest||[]).slice().sort((a,b)=>b.size-a.size);renderLargestContent(container,fallback);status.textContent=`使用快照中的最大文件记录 · ${error.message}`})}
function renderGlobalSearch(tree){tree.className='file-view';tree.onscroll=null;tree.innerHTML=`<div class="file-view-head"><div><b>全局文件搜索</b><br><span>搜索整个扫描范围，不受当前所在目录影响</span></div><span id="fileSearchStatus">请输入文件名</span></div><div class="file-search-tools"><input id="globalSearchInput" value="${esc(globalSearchQuery)}" placeholder="输入文件名，例如：video 或 ^IMG_.*\\.mov$"><select id="globalSearchMode"><option value="name" ${globalSearchMode==='name'?'selected':''}>文件名包含</option><option value="regex" ${globalSearchMode==='regex'?'selected':''}>正则表达式</option></select><button onclick="runGlobalFileSearch()">搜索全盘</button></div><div class="file-search-note">结果默认按文件大小从大到小排列，最多显示 5,000 个。</div><div id="globalFileResults" class="global-file-results"><div class="file-empty">${globalSearchRows.length?'正在恢复上次结果…':'输入关键词后开始搜索'}</div></div>`;const input=el('globalSearchInput');input.addEventListener('keydown',event=>{if(event.key==='Enter')runGlobalFileSearch()});if(globalSearchRows.length){renderGlobalFileRows(el('globalFileResults'),globalSearchRows);el('fileSearchStatus').textContent=`上次找到 ${globalSearchRows.length.toLocaleString()} 个文件`}el('resultCount').textContent=globalSearchRows.length?`${globalSearchRows.length.toLocaleString()} 个搜索结果`:'全局搜索'}
async function runGlobalFileSearch(){const input=el('globalSearchInput'),mode=el('globalSearchMode'),status=el('fileSearchStatus'),container=el('globalFileResults'),query=input.value.trim();if(!query){status.textContent='请输入文件名或正则表达式';input.focus();return}globalSearchQuery=query;globalSearchMode=mode.value;status.textContent='正在搜索完整文件索引…';container.innerHTML='<div class="file-empty">正在搜索…</div>';const token=++fileViewToken;try{const response=await fetch('/api/files/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({snapshot_id:activeSnapshotId||'',query,mode:globalSearchMode,limit:5000})}),data=await response.json();if(token!==fileViewToken||viewMode!=='search')return;if(!response.ok)throw new Error(data.error||'搜索失败');globalSearchRows=data.items||[];renderGlobalFileRows(container,globalSearchRows);status.textContent=`找到 ${globalSearchRows.length.toLocaleString()} 个文件${data.has_more?'（仅显示前 5,000 个）':''} · ${fileIndexNote(data.complete)}`;el('resultCount').textContent=`${globalSearchRows.length.toLocaleString()} 个搜索结果`}catch(error){if(token!==fileViewToken||viewMode!=='search')return;container.innerHTML='<div class="file-empty">无法完成搜索</div>';status.textContent=error.message}}
function renderMapTiles(nodes,width,height,level,limit){if(mapRenderCount>=12000){mapLimitHit=true;return''}const boxes=squarify(nodes,width,height);return boxes.map(({node:n,x,y,w,h})=>{if(mapRenderCount++>=12000){mapLimitHit=true;return''}const kind=nodeKind(n),canEnter=kind==='folder'&&n.children?.length,index=addMapNode(n),density=w<28||h<21?'tiny':w<88||h<47?'compact':'',style=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`,title=`${esc(n.name)} · ${fmt(n.size)}&#10;${esc(n.path)}`;if(canEnter&&level<limit&&w>=112&&h>=78){const children=sortedChildren(n),nested=renderMapTiles(children,Math.max(w-4,1),Math.max(h-31,1),level+1,limit);return `<div class="map-tile map-folder" style="${style}" title="${title}"><button class="map-tile-head" onclick="openMapNode(${index},event)">${esc(n.name)} <small>${fmt(n.size)}</small></button><div class="map-nested">${nested}</div></div>`}return `<button class="map-tile map-leaf ${density}" onclick="openMapNode(${index},event)" title="${title}" style="${style};background:linear-gradient(145deg,${tileColor(n)},#172441)"><b>${esc(n.name)}</b><small>${fmt(n.size)}</small></button>`}).join('')}
function renderTreemap(tree,nodes){if(treeDepth==='1'){tree.className='treemap';tree.innerHTML='';const boxes=squarify(nodes,Math.max(tree.clientWidth,1),Math.max(tree.clientHeight,1));tree.innerHTML=boxes.map(({node:n,x,y,w,h})=>{const density=w<26||h<20?'tiny':w<85||h<48?'compact':'',index=current.children.indexOf(n),kind=nodeKind(n);return `<button class="tile ${kind} ${density}" onclick="openNodeAt(${index})" title="${esc(n.name)} · ${fmt(n.size)}&#10;${esc(n.path)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:linear-gradient(145deg,${tileColor(n)},#172441)"><b>${esc(n.name)}</b><small>${fmt(n.size)}</small><em>${kind==='folder'?(n.children?.length||0)+' 项':esc(n.ext||'')}</em></button>`}).join('');return}tree.className='grouped-map-view';tree.onscroll=null;tree.innerHTML='';expandedMapNodes=[];mapRenderCount=0;mapLimitHit=false;const folders=[],rootFiles=[];for(const n of nodes){if(nodeKind(n)==='folder')folders.push({node:n,children:sortedChildren(n),synthetic:false});else rootFiles.push(n)}if(rootFiles.length){folders.push({node:{name:'根目录文件',path:current.path,size:rootFiles.reduce((sum,n)=>sum+n.size,0),kind:'folder'},children:rootFiles,synthetic:true})}const largest=Math.max(...folders.map(group=>group.node.size),1),width=Math.max(tree.clientWidth-18,280),limit=maxDepth();let html='';for(const group of folders){const ratio=Math.sqrt(Math.max(group.node.size,1)/largest),height=Math.round(Math.min(540,Math.max(210,150+ratio*250+Math.min(85,Math.log2(group.children.length+1)*14)))),index=group.synthetic?-1:addMapNode(group.node),open=group.synthetic?'':`onclick="openMapNode(${index},event)"`,count=group.children.length;if(!count){html+=`<section class="map-group"><div class="map-group-head"><button ${open}>${esc(group.node.name)}</button><strong>${fmt(group.node.size)}</strong><small>空文件夹</small></div><div class="map-empty">这个文件夹中没有可显示的项目</div></section>`;continue}const tiles=renderMapTiles(group.children,width,height,2,limit);html+=`<section class="map-group"><div class="map-group-head"><button ${open} title="${esc(group.node.path)}">${esc(group.node.name)}</button><strong>${fmt(group.node.size)}</strong><small>${count.toLocaleString()} 个直接项目 · 内部矩形按大小分配</small></div><div class="group-map" style="height:${height}px">${tiles}</div></section>`}tree.innerHTML=html+(mapLimitHit?'<div class="map-limit-note">目录项目很多：矩形视图已优先绘制可辨认区域；切换到“列表”或“条形”仍可连续查看全部项目。</div>':'');el('resultCount').textContent=`${nodes.length.toLocaleString()} 个一级项目 · ${mapRenderCount.toLocaleString()} 个矩形`}
function renderList(tree,nodes){flatViewRows=treeDepth==='1'?nodes.map(node=>({node,level:1})):groupedHierarchy(nodes);el('resultCount').textContent=`${flatViewRows.length.toLocaleString()} 项${treeDepth==='1'?'':' · 按一级目录分段'}`;setupVirtual(tree,flatViewRows,39,(row,index)=>{const n=row.node,kind=nodeKind(n),canOpen=kind==='folder'&&n.children?.length,indent=Math.min((row.level-1)*16,240),groupClass=row.isGroup?' list-group-row':'';return `<div class="list-row${groupClass}"><div class="list-name" style="padding-left:${indent}px"><b>${row.isGroup?'▾':kind==='folder'?'▸':'·'} ${esc(n.name)}</b><small title="${esc(n.path)}">${esc(n.path)}</small></div><span class="kind-pill">${row.isGroup?'一级目录':kind==='folder'?'文件夹':esc(n.ext||'文件')}</span><strong>${fmt(n.size)}</strong><button class="enter-btn" ${canOpen?`onclick="openFlatRow(${index})"`:'disabled'}>${canOpen?'进入':'—'}</button></div>`},treeDepth==='1'?'list-view':'list-view grouped-list-view')}
function renderBars(tree,nodes){flatViewRows=treeDepth==='1'?nodes.map(node=>({node,level:1})):groupedHierarchy(nodes);el('resultCount').textContent=`${flatViewRows.length.toLocaleString()} 项${treeDepth==='1'?'':' · 按一级目录分段'}`;const largest=Math.max(...flatViewRows.slice(0,10000).map(row=>row.node.size),1);setupVirtual(tree,flatViewRows,treeDepth==='1'?36:44,(row,index)=>{const n=row.node,kind=nodeKind(n),canOpen=kind==='folder'&&n.children?.length,pct=n.size/largest*100,indent=Math.min((row.level-1)*16,240),groupClass=row.isGroup?' bar-group-row':'';return `<div class="bar-row${groupClass}"><button class="bar-label" style="padding-left:${indent}px" ${canOpen?`onclick="openFlatRow(${index})"`:'disabled'} title="${esc(n.path)}">${row.isGroup?'▾':kind==='folder'?'▸':'·'} ${esc(n.name)}</button><div class="bar-track"><i class="bar-fill" style="width:${pct}%;background:${tileColor(n)}"></i></div><b class="bar-size">${fmt(n.size)}</b></div>`},treeDepth==='1'?'bars-view':'bars-view grouped-bars-view')}
function openNodeAt(index){const n=current.children[index];if(!n||nodeKind(n)==='file'||!n.children?.length)return;current=n;history.push(n);el('search').value='';el('typeFilter').value='all';render()}
function openNodeChain(chain){let node=current;const entered=[];for(const part of chain.split('.')){const next=node.children?.[Number(part)];if(!next)break;node=next;if(nodeKind(node)==='folder')entered.push(node)}if(!entered.length||nodeKind(node)==='file'||!node.children?.length)return;current=node;history.push(...entered);el('search').value='';el('typeFilter').value='all';render()}
function openDirectNode(n){if(!n||nodeKind(n)==='file'||!n.children?.length)return;current=n;history.push(n);el('search').value='';el('typeFilter').value='all';render()}
function openMapNode(index,event){event?.stopPropagation();openDirectNode(expandedMapNodes[index])}
function openFlatRow(index){openDirectNode(flatViewRows[index]?.node)}
function openCascadeGroup(index){const n=cascadeGroups[index]?.node;if(n!==current)openDirectNode(n)}
function openCascadeChild(groupIndex,childIndex){openDirectNode(cascadeGroups[groupIndex]?.node?.children?.[childIndex])}
function setView(mode){viewMode=mode;['Overview','Treemap','List','Bars','Largest','Search'].forEach(name=>el('view'+name).classList.toggle('active',name.toLowerCase()===mode));el('depthControls').style.display=['overview','largest','search'].includes(mode)?'none':'';render()}
function syncDepthButton(){el('expandAllBtn').textContent=treeDepth==='all'?'收起到当前层':'一键展开全部'}
function toggleFullExpand(){setTreeDepth(treeDepth==='all'?'1':'all')}
function setTreeDepth(depth){treeDepth=depth;el('treeDepth').value=depth;syncDepthButton();render();showToast(depth==='all'?'已按层级向下完全展开；再次点击可收起':'已恢复当前层视图')}
function jump(i){history=history.slice(0,i+1);current=history[i];render()}function toggleOrder(){ascending=!ascending;el('orderBtn').textContent=ascending?'升序 ↑':'降序 ↓';render()}
function renderSide(){el('types').innerHTML=result.types.map(t=>`<div class="type-row"><div><b>${esc(t.ext)}</b><small>${(t.size/result.root.size*100).toFixed(1)}%</small></div><b>${fmt(t.size)}</b></div>`).join('');el('largest').innerHTML=result.largest.slice(0,15).map(f=>`<div class="file-row"><div><b>${esc(f.name)}</b><small title="${esc(f.path)}">${esc(f.ext)}</small></div><b>${fmt(f.size)}</b></div>`).join('')}
let resizeTimer=null;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(current)render()},120)});
loadDrives();loadSnapshotList();
</script>
</body></html>
