<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceLens 本地磁盘分析器</title>
<style>
:root{--bg:#07101c;--panel:#101b2b;--line:#26354b;--text:#edf4ff;--muted:#8191aa;--accent:#617dff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,"Microsoft YaHei";min-height:100vh}button,input{font:inherit}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0b1522}.brand{font-weight:800;font-size:18px}.brand i{font-style:normal;background:linear-gradient(135deg,#6e88ff,#8255ea);padding:10px 13px;border-radius:10px;margin-right:10px}.brand small{display:block;color:var(--muted);font-size:10px;margin:4px 0 0 49px}.privacy{font-size:11px;color:#74d7ae;background:#163328;border:1px solid #286044;padding:7px 10px;border-radius:20px}.hero{padding:24px 28px 18px}.hero h1{font-size:25px;margin:0 0 6px}.hero p{color:var(--muted);margin:0}.drives{display:flex;gap:12px;padding:0 28px 20px;overflow:auto}.drive{min-width:245px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;color:inherit;text-align:left;cursor:pointer}.drive:hover{border-color:var(--accent)}.drive b,.drive small{display:block}.drive small{color:var(--muted);margin:6px 0}.bar{height:4px;background:#26354b;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;padding:0 28px 28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{min-height:56px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.crumbs button{border:0;background:none;color:#aebbd0;cursor:pointer}.stats{display:flex;gap:35px;padding:14px 16px}.stats div{display:flex;flex-direction:column}.stats span{color:var(--muted);font-size:10px}.stats b{font-size:18px;margin-top:4px}.treemap{height:500px;background:#060d17;padding:5px;display:flex;flex-wrap:wrap;gap:4px;align-content:stretch}.tile{border:0;border-radius:4px;color:white;padding:12px;text-align:left;min-width:100px;min-height:80px;position:relative;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff28}.tile:hover{filter:brightness(1.2)}.tile b{display:block}.tile small{opacity:.75}.tile em{position:absolute;right:7px;bottom:7px;font-size:9px;font-style:normal}.side{padding:16px}.side h2{font-size:15px;margin:0 0 14px}.type-row,.file-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #213047}.type-row small,.file-row small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.type-row b,.file-row>b{font-size:11px}.progress{display:none;position:fixed;left:50%;bottom:25px;transform:translateX(-50%);width:min(470px,calc(100% - 24px));background:#152237ee;border:1px solid #5975f5;border-radius:10px;padding:14px 16px;box-shadow:0 15px 50px #000b}.progress.show{display:flex;justify-content:space-between}.progress small{color:var(--muted)}.empty{height:500px;display:grid;place-items:center;color:var(--muted);text-align:center}.warn{color:#ffbd75}.path-scan{display:flex;gap:7px}.path-scan input{background:#091321;border:1px solid var(--line);color:white;border-radius:6px;padding:7px;width:230px}.path-scan button{background:var(--accent);color:white;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}.path-scan .choose{background:#20304a;border:1px solid #3b4e6c}.path-scan button:disabled{opacity:.55;cursor:wait}@media(max-width:900px){.layout{grid-template-columns:1fr}.path-scan input{width:150px}}@media(max-width:600px){header,.hero,.drives,.layout{padding-left:12px;padding-right:12px}.privacy{display:none}.panel-head{height:auto;padding:12px;gap:8px;align-items:flex-start;flex-direction:column}.path-scan{width:100%;flex-wrap:wrap}.path-scan input{flex:1}.treemap{height:420px}}
</style></head><body>
<header><div class="brand"><i>S</i>SpaceLens<small>完全本地 · Windows 磁盘分析器</small></div><div class="privacy">● 数据不会离开此电脑</div></header>
<section class="hero"><h1>本机存储空间</h1><p>选择磁盘开始扫描，或输入任意文件夹路径。</p></section>
<section class="drives" id="drives"></section>
<main class="layout"><section class="panel"><div class="panel-head"><div class="crumbs" id="crumbs">尚未扫描</div><div class="path-scan"><input id="path" readonly placeholder="请选择要扫描的目录"><button id="chooseBtn" class="choose" onclick="chooseFolder()">选择目录…</button><button onclick="scanPath()">开始扫描</button></div></div><div class="stats"><div><span>当前目录大小</span><b id="size">—</b></div><div><span>文件</span><b id="files">—</b></div><div><span>文件夹</span><b id="folders">—</b></div></div><div id="tree" class="empty">点击上方磁盘，或点击“选择目录”开始<br><small>大型磁盘首次扫描可能需要几分钟</small></div></section>
<aside class="panel side"><h2>文件类型</h2><div id="types" class="warn">扫描完成后显示统计</div><h2 style="margin-top:24px">最大的文件</h2><div id="largest"></div></aside></main>
<div class="progress" id="progress"><div><b>正在读取磁盘…</b><br><small id="progressText"></small></div><b id="progressSize"></b></div>
<script>
const colors=['#637dff','#8d63ff','#42b8a8','#e46696','#e2a442','#4e9be6','#45b77c','#6b788d'];let result=null,current=null,history=[];
const fmt=n=>n>=1099511627776?(n/1099511627776).toFixed(2)+' TB':n>=1073741824?(n/1073741824).toFixed(1)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(1)+' KB':n+' B';
async function loadDrives(){const ds=await fetch('/api/drives').then(r=>r.json());drives.innerHTML=ds.map(d=>`<button class="drive" onclick="start('${d.path.replace(/\\/g,'\\\\')}')"><b>本地磁盘 (${d.path})</b><small>${fmt(d.used)} / ${fmt(d.total)} · ${Math.round(d.used/d.total*100)}% 已用</small><div class="bar"><i style="width:${d.used/d.total*100}%"></i></div></button>`).join('')}
async function start(path){await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});progress.classList.add('show');poll()}
function scanPath(){if(path.value.trim())start(path.value.trim())}
async function chooseFolder(){chooseBtn.disabled=true;chooseBtn.textContent='等待选择…';try{const data=await fetch('/api/pick-folder').then(r=>r.json());if(data.error)throw new Error(data.error);if(data.path)path.value=data.path}catch(e){alert('无法打开目录选择窗口：'+e.message)}finally{chooseBtn.disabled=false;chooseBtn.textContent='选择目录…'}}
async function poll(){const s=await fetch('/api/status').then(r=>r.json());files.textContent=s.files.toLocaleString();folders.textContent=s.folders.toLocaleString();progressText.textContent=`${s.files.toLocaleString()} 个文件 · ${s.folders.toLocaleString()} 个文件夹`;progressSize.textContent=fmt(s.bytes);if(s.running)return setTimeout(poll,600);progress.classList.remove('show');if(s.error)return alert(s.error);result=s.result;current=result.root;history=[current];render();renderSide()}
function render(){size.textContent=fmt(current.size);crumbs.innerHTML=history.map((n,i)=>`<button onclick="jump(${i})">${n.name}</button>${i<history.length-1?' › ':''}`).join('');if(!current.children.length){tree.className='empty';tree.innerHTML='此目录没有可显示的子文件夹';return}tree.className='treemap';const total=current.children.reduce((a,n)=>a+n.size,0)||1;tree.innerHTML=current.children.map((n,i)=>`<button class="tile" onclick="openNode(${i})" style="background:linear-gradient(145deg,${colors[i%colors.length]},#172441);flex-grow:${Math.max(n.size,1)};flex-basis:${Math.max(18,n.size/total*100)}%"><b>${escapeHtml(n.name)}</b><small>${fmt(n.size)}</small><em>${n.children.length} 个目录</em></button>`).join('')}
function openNode(i){const n=current.children[i];if(!n.children.length)return;current=n;history.push(n);render()}function jump(i){history=history.slice(0,i+1);current=history[i];render()}
function renderSide(){types.innerHTML=result.types.map(t=>`<div class="type-row"><div><b>${escapeHtml(t.ext)}</b><small>${(t.size/result.root.size*100).toFixed(1)}%</small></div><b>${fmt(t.size)}</b></div>`).join('');largest.innerHTML=result.largest.slice(0,12).map(f=>`<div class="file-row"><div><b>${escapeHtml(f.name)}</b><small title="${escapeHtml(f.path)}">${escapeHtml(f.ext)}</small></div><b>${fmt(f.size)}</b></div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}loadDrives();
</script></body></html>
