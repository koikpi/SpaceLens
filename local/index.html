<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceLens 本地磁盘分析器</title>
<style>
:root{--bg:#07101c;--panel:#101b2b;--line:#26354b;--text:#edf4ff;--muted:#8191aa;--accent:#617dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,"Microsoft YaHei";min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0b1522}.brand{font-weight:800;font-size:18px}.brand i{font-style:normal;background:linear-gradient(135deg,#6e88ff,#8255ea);padding:10px 13px;border-radius:10px;margin-right:10px}.brand small{display:block;color:var(--muted);font-size:10px;margin:4px 0 0 49px}.privacy{font-size:11px;color:#74d7ae;background:#163328;border:1px solid #286044;padding:7px 10px;border-radius:20px}
.hero{padding:24px 28px 18px}.hero h1{font-size:25px;margin:0 0 6px}.hero p{color:var(--muted);margin:0}.drives{display:flex;gap:12px;padding:0 28px 20px;overflow:auto}.drive{min-width:245px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;color:inherit;text-align:left}.drive:hover{border-color:var(--accent)}.drive b,.drive small{display:block}.drive small{color:var(--muted);margin:6px 0}.bar{height:4px;background:#26354b;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;padding:0 28px 28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{min-height:58px;padding:9px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.crumbs button{border:0;background:none;color:#aebbd0;padding:2px}.path-scan{display:flex;gap:7px}.path-scan input,.toolbar input,.toolbar select{background:#091321;border:1px solid var(--line);color:white;border-radius:6px;padding:7px}.path-scan input{width:220px}.path-scan button{background:var(--accent);color:white;border:0;border-radius:6px;padding:7px 11px}.path-scan .choose{background:#20304a;border:1px solid #3b4e6c}.path-scan button:disabled{opacity:.55;cursor:wait}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:#0c1725}.toolbar input{min-width:180px;flex:1}.toolbar select{min-width:105px}.toolbar button{border:1px solid var(--line);background:#1b2a40;color:#dbe6f7;border-radius:6px;padding:7px 10px}.result-count{font-size:10px;color:var(--muted);white-space:nowrap}.stats{display:flex;gap:35px;padding:14px 16px}.stats div{display:flex;flex-direction:column}.stats span{color:var(--muted);font-size:10px}.stats b{font-size:18px;margin-top:4px}
.view-switch{display:flex;background:#091321;border:1px solid var(--line);border-radius:7px;padding:2px}.view-switch button{border:0;background:transparent;padding:5px 7px;color:var(--muted)}.view-switch button.active{background:#30425f;color:#fff}
.depth-controls{display:flex;gap:5px;align-items:center}.depth-controls select{min-width:92px}.expand-btn{white-space:nowrap}
.treemap{height:500px;background:#060d17;position:relative;overflow:hidden}.tile{border:2px solid #07101c;border-radius:5px;color:white;padding:9px;text-align:left;position:absolute;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff28;transition:filter .15s}.tile:hover{filter:brightness(1.22);z-index:3}.tile b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{opacity:.8}.tile em{position:absolute;right:7px;bottom:6px;font-size:9px;font-style:normal}.tile.file{border-style:dashed}.tile.compact{padding:5px}.tile.compact b{font-size:10px}.tile.compact small,.tile.compact em{display:none}.tile.tiny{padding:0}.tile.tiny>*{display:none}
.tile.folder-expanded{padding:0;border-color:#d7e0f033;background:#0d1929!important}.tile-head{position:absolute;left:0;right:0;top:0;height:27px;border:0;background:#ffffff0a;color:#fff;text-align:left;padding:5px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10px;z-index:2}.nested-area{position:absolute;left:2px;right:2px;top:28px;bottom:2px;overflow:hidden}.nested-limit{position:absolute;right:4px;bottom:3px;background:#07101ccc;color:#b9c7da;padding:2px 4px;border-radius:3px;font-size:8px;z-index:5}
.list-view,.bars-view{height:500px;overflow:auto;background:#091321;padding:6px}.list-row{display:grid;grid-template-columns:minmax(220px,1.4fr) 100px 110px 70px;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid #1d2c42}.list-row:hover,.bar-row:hover{background:#142238}.list-name{min-width:0}.list-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-name small{display:block;color:var(--muted);font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kind-pill{font-size:9px;color:#aebdd4}.enter-btn{border:1px solid #405879;background:#20324d;color:#e4edfa;border-radius:5px;padding:5px 7px}.enter-btn:disabled{opacity:.25;cursor:default}.bar-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1.5fr) 90px;gap:12px;align-items:center;padding:9px 10px;border-bottom:1px solid #1d2c42}.bar-label{border:0;background:none;color:var(--text);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-track{height:16px;background:#1c2a3e;border-radius:4px;overflow:hidden}.bar-fill{display:block;height:100%;min-width:1px;border-radius:4px}.bar-size{text-align:right;font-size:11px}
.side{padding:16px}.side h2{font-size:15px;margin:0 0 14px}.type-row,.file-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #213047}.type-row small,.file-row small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.type-row b,.file-row>b{font-size:11px}.empty{height:500px;display:grid;place-items:center;color:var(--muted);text-align:center}.warn{color:#ffbd75}
.save-btn{background:#2a7f66!important;border-color:#3ba581!important}.saved-list{margin-bottom:22px;max-height:260px;overflow:auto}.saved-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;align-items:center;border-bottom:1px solid #213047;padding:9px 0}.saved-info{min-width:0}.saved-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.saved-row small{display:block;color:var(--muted);font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-row .open{border:1px solid #3d5274;background:#20314b;color:#dce8fa;border-radius:5px;padding:5px 7px;font-size:9px}.saved-row .delete{border:0;background:none;color:#e67d8f;font-size:15px;padding:2px 5px}.saved-row.active{background:#192941;margin:0 -7px;padding-left:7px;padding-right:7px;border-radius:6px}.saved-empty{color:var(--muted);font-size:10px;padding:4px 0 14px}.history-banner{display:none;padding:9px 16px;background:#282343;border-bottom:1px solid #564b84;color:#d8d0ff;font-size:11px}.history-banner.show{display:flex;justify-content:space-between;align-items:center}.history-banner button{border:0;background:none;color:#aabaff}.toast{position:fixed;right:22px;bottom:22px;background:#183b31;border:1px solid #3c9677;color:#d9fff0;padding:11px 15px;border-radius:8px;box-shadow:0 12px 35px #0008;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}
.progress{display:none;position:fixed;left:50%;bottom:25px;transform:translateX(-50%);width:min(510px,calc(100% - 24px));background:#152237f5;border:1px solid #5975f5;border-radius:10px;padding:14px 16px;box-shadow:0 15px 50px #000b;align-items:center;gap:16px;z-index:9}.progress.show{display:flex}.progress>div{flex:1}.progress small{color:var(--muted)}.stop{background:#d95468;color:white;border:0;border-radius:7px;padding:8px 12px;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#020711bb;z-index:30;padding:24px;align-items:center;justify-content:center}.modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#101b2b;border:1px solid #344661;border-radius:12px;box-shadow:0 24px 80px #000c}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:16px}.close-btn{border:0;background:none;color:#9dadc4;font-size:21px}.dup-controls{padding:16px 18px;display:grid;gap:14px}.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.method{background:#0b1523;border:1px solid var(--line);border-radius:7px;padding:10px}.method label{display:flex;gap:7px;align-items:center;font-size:11px}.method small{display:block;color:var(--muted);font-size:9px;margin:6px 0 0 20px}.dup-options{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.dup-options label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:9px}.dup-options select{background:#091321;border:1px solid var(--line);color:white;border-radius:6px;padding:7px}.primary-btn{background:var(--accent);color:white;border:0;border-radius:7px;padding:8px 13px}.dup-progress{display:none;background:#0a1422;border:1px solid var(--line);border-radius:7px;padding:11px;align-items:center;gap:12px}.dup-progress.show{display:flex}.dup-progress div{flex:1}.dup-progress small{color:var(--muted)}.dup-summary{display:none;grid-template-columns:repeat(3,1fr);gap:8px}.dup-summary.show{display:grid}.dup-stat{background:#0a1422;border:1px solid var(--line);border-radius:7px;padding:10px}.dup-stat span{display:block;color:var(--muted);font-size:9px}.dup-stat b{display:block;margin-top:4px}.dup-results{display:grid;gap:10px}.dup-group{border:1px solid var(--line);border-radius:8px;overflow:hidden}.dup-group-head{display:flex;justify-content:space-between;background:#15243a;padding:9px 11px;font-size:10px}.dup-file{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:8px 11px;border-top:1px solid #1e2d43;align-items:center}.dup-file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.confidence{color:#70ddb0}.duplicate-btn{background:#513c7d!important;border-color:#755dab!important}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.panel-head{align-items:flex-start;flex-direction:column}.path-scan{width:100%}.path-scan input{flex:1}.toolbar{flex-wrap:wrap}}@media(max-width:600px){header,.hero,.drives,.layout{padding-left:12px;padding-right:12px}.privacy{display:none}.path-scan{flex-wrap:wrap}.treemap,.empty{height:420px}.toolbar input{width:100%;flex-basis:100%}.method-grid{grid-template-columns:1fr}.modal{padding:8px}.dup-summary{grid-template-columns:1fr}.depth-controls{width:100%}}
</style>
</head>
<body>
<header><div class="brand"><i>S</i>SpaceLens<small>完全本地 · Windows 磁盘分析器</small></div><div class="privacy">● 数据不会离开此电脑</div></header>
<section class="hero"><h1>本机存储空间</h1><p>选择磁盘或文件夹开始扫描；扫描过程中可随时停止。</p></section>
<section class="drives" id="drives"></section>
<main class="layout">
  <section class="panel">
    <div class="panel-head">
      <div class="crumbs" id="crumbs">尚未扫描</div>
      <div class="path-scan"><input id="path" readonly placeholder="请选择要扫描的目录"><button id="chooseBtn" class="choose" onclick="chooseFolder()">选择目录…</button><button onclick="scanPath()">开始扫描</button></div>
    </div>
    <div id="historyBanner" class="history-banner"><span id="historyText"></span><button onclick="clearHistoryView()">关闭提示</button></div>
    <div class="toolbar">
      <input id="search" placeholder="搜索当前目录中的文件或文件夹…" oninput="render()">
      <select id="kindFilter" onchange="render()"><option value="all">全部项目</option><option value="folder">仅文件夹</option><option value="file">仅文件</option></select>
      <select id="typeFilter" onchange="render()"><option value="all">全部类型</option></select>
      <select id="sortBy" onchange="render()"><option value="size">按大小排序</option><option value="name">按名称排序</option><option value="type">按类型排序</option></select>
      <div class="view-switch"><button id="viewTreemap" class="active" onclick="setView('treemap')">矩形</button><button id="viewList" onclick="setView('list')">列表</button><button id="viewBars" onclick="setView('bars')">条形</button></div>
      <div id="depthControls" class="depth-controls"><select id="treeDepth" onchange="setTreeDepth(this.value)"><option value="1">当前层</option><option value="2">展开 2 层</option><option value="3">展开 3 层</option><option value="all">全部层级</option></select><button class="expand-btn" onclick="setTreeDepth('all')">一键展开全部</button></div>
      <button id="orderBtn" onclick="toggleOrder()">降序 ↓</button><button class="duplicate-btn" onclick="openDuplicates()">查找重复</button><button class="save-btn" onclick="saveSnapshot()">保存结果</button><span id="resultCount" class="result-count"></span>
    </div>
    <div class="stats"><div><span>当前目录大小</span><b id="size">—</b></div><div><span>已扫描文件</span><b id="files">—</b></div><div><span>已扫描文件夹</span><b id="folders">—</b></div></div>
    <div id="tree" class="empty">点击上方磁盘，或点击“选择目录”开始<br><small>大型磁盘首次扫描可能需要几分钟</small></div>
  </section>
  <aside class="panel side"><h2>历史扫描时间点</h2><div id="savedList" class="saved-list"><div class="saved-empty">每次扫描完成后会自动保存</div></div><h2>文件类型</h2><div id="types" class="warn">扫描完成后显示统计</div><h2 style="margin-top:24px">最大的文件</h2><div id="largest"></div></aside>
</main>
<div class="progress" id="progress"><div><b>正在读取磁盘…</b><br><small id="progressText"></small></div><b id="progressSize"></b><button class="stop" onclick="cancelScan()">停止扫描</button></div>
<div id="toast" class="toast"></div>
<div id="duplicateModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="duplicateTitle">
  <section class="modal-card">
    <div class="modal-head"><div><h2 id="duplicateTitle">查找重复文件</h2><small id="duplicateScope"></small></div><button class="close-btn" onclick="closeDuplicates()" aria-label="关闭">×</button></div>
    <div class="dup-controls">
      <div class="method-grid">
        <div class="method"><label><input type="checkbox" checked disabled> 文件大小预筛选</label><small>必选，不读取文件内容</small></div>
        <div class="method"><label><input id="dupQuick" type="checkbox" checked> 分段快速指纹</label><small>速度快，读取三个位置</small></div>
        <div class="method"><label><input id="dupSha" type="checkbox" checked> 完整 SHA-256</label><small>推荐，内容级准确识别</small></div>
        <div class="method"><label><input id="dupByte" type="checkbox"> 逐字节确认</label><small>最严格，网络盘会更慢</small></div>
      </div>
      <div class="dup-options"><label>忽略小于<select id="dupMinSize"><option value="1048576">1 MB</option><option value="10485760">10 MB</option><option value="104857600">100 MB</option><option value="1073741824">1 GB</option></select></label><button class="primary-btn" onclick="startDuplicates()">开始查重</button></div>
      <div id="dupProgress" class="dup-progress"><div><b id="dupPhase">准备中…</b><br><small id="dupProgressText"></small></div><button class="stop" onclick="cancelDuplicates()">停止</button></div>
      <div id="dupSummary" class="dup-summary"><div class="dup-stat"><span>重复组</span><b id="dupGroups">0</b></div><div class="dup-stat"><span>重复文件</span><b id="dupFiles">0</b></div><div class="dup-stat"><span>潜在可释放</span><b id="dupReclaim">0 B</b></div></div>
      <div id="dupResults" class="dup-results"></div>
    </div>
  </section>
</div>
<script>
const colors=['#637dff','#8d63ff','#42b8a8','#e46696','#e2a442','#4e9be6','#45b77c','#6b788d'];
let result=null,current=null,history=[],ascending=false,activeSnapshotId=null,toastTimer=null,viewMode='treemap',treeDepth='1',nestedRendered=0,dupPollTimer=null;
const el=id=>document.getElementById(id);
const fmt=n=>n>=1099511627776?(n/1099511627776).toFixed(2)+' TB':n>=1073741824?(n/1073741824).toFixed(1)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(1)+' KB':n+' B';
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadDrives(){const ds=await fetch('/api/drives').then(r=>r.json());el('drives').innerHTML=ds.map(d=>`<button class="drive" onclick="start(${JSON.stringify(d.path)})"><b>${d.is_network?'网络共享':'本地磁盘'} (${esc(d.path)})</b>${d.remote?`<small title="${esc(d.remote)}">${esc(d.remote)}</small>`:''}<small>${fmt(d.used)} / ${fmt(d.total)} · ${Math.round(d.used/d.total*100)}% 已用${d.is_network?'（底层卷容量）':''}</small><div class="bar"><i style="width:${d.used/d.total*100}%"></i></div></button>`).join('')}
async function start(scanPath){const response=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:scanPath})});const data=await response.json();if(!response.ok)return alert(data.error||'无法开始扫描');clearHistoryView();el('progress').classList.add('show');poll()}
function scanPath(){if(el('path').value.trim())start(el('path').value.trim());else alert('请先选择目录')}
async function chooseFolder(){el('chooseBtn').disabled=true;el('chooseBtn').textContent='等待选择…';try{const data=await fetch('/api/pick-folder').then(r=>r.json());if(data.error)throw new Error(data.error);if(data.path)el('path').value=data.path}catch(e){alert('无法打开目录选择窗口：'+e.message)}finally{el('chooseBtn').disabled=false;el('chooseBtn').textContent='选择目录…'}}
async function cancelScan(){el('progressText').textContent='正在停止，请稍候…';await fetch('/api/cancel',{method:'POST'})}
async function poll(){const s=await fetch('/api/status').then(r=>r.json());el('files').textContent=s.files.toLocaleString();el('folders').textContent=s.folders.toLocaleString();el('progressText').textContent=`${s.files.toLocaleString()} 个文件 · ${s.folders.toLocaleString()} 个文件夹`;el('progressSize').textContent=fmt(s.bytes);if(s.running)return setTimeout(poll,500);el('progress').classList.remove('show');if(s.cancelled)return showToast('扫描已停止');if(s.error)return alert(s.error);result=s.result;current=result.root;history=[current];fillTypes();render();renderSide();await loadSnapshotList();showToast('扫描完成，已自动保存为历史快照')}
async function saveSnapshot(){if(!result)return alert('请先完成一次扫描');const suggested=(history[0]?.name||'磁盘扫描')+' '+new Date().toLocaleDateString();const name=prompt('给这次扫描起一个名称：',suggested);if(name===null)return;const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const data=await response.json();if(!response.ok)return alert(data.error||'保存失败');activeSnapshotId=data.id;await loadSnapshotList();showToast('已保存，可在右侧“历史扫描时间点”中重新打开')}
async function loadSnapshotList(){const items=await fetch('/api/snapshots').then(r=>r.json());el('savedList').innerHTML=items.length?items.map(s=>`<div class="saved-row ${s.id===activeSnapshotId?'active':''}"><div class="saved-info"><b>${s.automatic?'◷ ':''}${esc(s.name)}</b><small>${new Date(s.created*1000).toLocaleString()} · ${fmt(s.bytes)}</small><small title="${esc(s.path||'')}">${esc(s.path||'')}</small></div><button class="open" onclick="openSnapshot('${s.id}',this)">打开</button><button class="delete" title="删除记录" onclick="deleteSnapshot('${s.id}')">×</button></div>`).join(''):'<div class="saved-empty">每次扫描完成后会自动保存</div>'}
async function openSnapshot(id,button){const oldText=button?.textContent;if(button){button.disabled=true;button.textContent='加载中…'}showToast('正在打开历史扫描…');try{const response=await fetch('/api/snapshot?id='+encodeURIComponent(id));const payload=await response.json();if(payload.error)return alert(payload.error);result=payload.result;current=result.root;history=[current];activeSnapshotId=id;treeDepth='1';el('treeDepth').value='1';el('files').textContent=(payload.meta.files||0).toLocaleString();el('folders').textContent=(payload.meta.folders||0).toLocaleString();el('search').value='';fillTypes();render();renderSide();el('historyText').textContent=`正在查看：${payload.meta.name} · ${new Date(payload.meta.created*1000).toLocaleString()}`;el('historyBanner').classList.add('show');await loadSnapshotList();showToast('历史扫描结果已打开；需要时可一键展开全部')}catch(error){alert('打开历史记录失败：'+error.message)}finally{if(button){button.disabled=false;button.textContent=oldText}}}
async function deleteSnapshot(id){if(!confirm('删除这条本地扫描记录？'))return;await fetch('/api/delete-snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});loadSnapshotList()}
function clearHistoryView(){activeSnapshotId=null;el('historyBanner').classList.remove('show');loadSnapshotList()}
function showToast(message){el('toast').textContent=message;el('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').classList.remove('show'),3200)}
function openDuplicates(){if(!current)return alert('请先完成扫描或打开一条历史记录');el('duplicateScope').textContent='范围：'+current.path;el('duplicateModal').classList.add('show')}
function closeDuplicates(){el('duplicateModal').classList.remove('show')}
async function startDuplicates(){const methods=[];if(el('dupQuick').checked)methods.push('quick');if(el('dupSha').checked)methods.push('sha256');if(el('dupByte').checked)methods.push('byte');const response=await fetch('/api/duplicates/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current.path,methods,min_size:Number(el('dupMinSize').value)})});const data=await response.json();if(!response.ok)return alert(data.error||'无法开始查重');el('dupProgress').classList.add('show');el('dupSummary').classList.remove('show');el('dupResults').innerHTML='';pollDuplicates()}
async function cancelDuplicates(){await fetch('/api/duplicates/cancel',{method:'POST'});el('dupPhase').textContent='正在停止…'}
async function pollDuplicates(){clearTimeout(dupPollTimer);const state=await fetch('/api/duplicates/status').then(r=>r.json());el('dupPhase').textContent=state.phase||'准备中…';el('dupProgressText').textContent=`已检查 ${Number(state.files||0).toLocaleString()} 个文件 · 候选 ${Number(state.candidates||0).toLocaleString()} 个`;if(state.running){dupPollTimer=setTimeout(pollDuplicates,600);return}el('dupProgress').classList.remove('show');if(state.cancelled)return showToast('重复文件检测已停止');if(state.error)return alert('查重失败：'+state.error);renderDuplicateResults(state)}
function renderDuplicateResults(state){const groups=state.result||[],fileCount=groups.reduce((sum,g)=>sum+g.paths.length,0),methods=state.methods||[],confidence=methods.includes('byte')?'逐字节确认':methods.includes('sha256')?'SHA-256 确认':methods.includes('quick')?'快速指纹候选':'仅大小相同候选';el('dupGroups').textContent=Number(state.groups||0).toLocaleString();el('dupFiles').textContent=fileCount.toLocaleString();el('dupReclaim').textContent=fmt(state.reclaimable||0);el('dupSummary').classList.add('show');const shown=groups.slice(0,100);el('dupResults').innerHTML=shown.length?shown.map((group,index)=>`<section class="dup-group"><div class="dup-group-head"><b>重复组 ${index+1} · ${fmt(group.size)}</b><span class="confidence">${confidence} · 可释放 ${fmt(group.reclaimable)}</span></div>${group.paths.map((path,i)=>`<label class="dup-file"><input type="checkbox" ${i?'checked':''}><span title="${esc(path)}">${esc(path)}</span><small>${i?'副本':'默认保留'}</small></label>`).join('')}</section>`).join('')+(groups.length>100?`<div class="saved-empty">结果较多，当前显示最大的 100 组，共 ${groups.length.toLocaleString()} 组。</div>`:''):'<div class="saved-empty">没有发现符合当前检测方式的重复文件。</div>';showToast(`查重完成：发现 ${state.groups||0} 组重复文件`)}
function fillTypes(){const values=['all',...new Set(result.types.map(t=>t.ext))];el('typeFilter').innerHTML=values.map(v=>`<option value="${esc(v)}">${v==='all'?'全部类型':esc(v)}</option>`).join('')}
function nodeKind(n){return n.kind||(n.ext?'file':'folder')}
function visibleNodes(){if(!current)return[];const q=el('search').value.trim().toLowerCase(),kind=el('kindFilter').value,type=el('typeFilter').value,sort=el('sortBy').value;let nodes=current.children.filter(n=>(!q||n.name.toLowerCase().includes(q))&&(kind==='all'||nodeKind(n)===kind)&&(type==='all'||n.ext===type));nodes.sort((a,b)=>{let v=sort==='size'?a.size-b.size:sort==='type'?(a.ext||'文件夹').localeCompare(b.ext||'文件夹','zh-CN'):a.name.localeCompare(b.name,'zh-CN',{numeric:true});return ascending?v:-v});return nodes}
function tileColor(node){const key=nodeKind(node)==='folder'?'folder:'+node.name:'file:'+node.ext;let hash=0;for(let i=0;i<key.length;i++)hash=((hash<<5)-hash)+key.charCodeAt(i);return colors[Math.abs(hash)%colors.length]}
function squarify(nodes,width,height){const weighted=nodes.filter(n=>n.size>0).map(node=>({node,area:node.size}));const total=weighted.reduce((s,i)=>s+i.area,0)||1;weighted.forEach(i=>i.area=i.area/total*width*height);let rect={x:0,y:0,w:width,h:height},row=[],output=[];const rowSum=r=>r.reduce((s,i)=>s+i.area,0);const worst=(r,side)=>{if(!r.length||side<=0)return Infinity;const sum=rowSum(r),values=r.map(i=>i.area),max=Math.max(...values),min=Math.max(Math.min(...values),.0001);return Math.max(side*side*max/(sum*sum),sum*sum/(side*side*min))};const place=r=>{const sum=rowSum(r);if(rect.w>=rect.h){const w=sum/Math.max(rect.h,.0001);let y=rect.y;r.forEach(i=>{const h=i.area/Math.max(w,.0001);output.push({node:i.node,x:rect.x,y,w,h});y+=h});rect={x:rect.x+w,y:rect.y,w:Math.max(0,rect.w-w),h:rect.h}}else{const h=sum/Math.max(rect.w,.0001);let x=rect.x;r.forEach(i=>{const w=i.area/Math.max(h,.0001);output.push({node:i.node,x,y:rect.y,w,h});x+=w});rect={x:rect.x,y:rect.y+h,w:rect.w,h:Math.max(0,rect.h-h)}}};for(const item of weighted){const side=Math.min(rect.w,rect.h);if(!row.length||worst([...row,item],side)<=worst(row,side))row.push(item);else{place(row);row=[item]}}if(row.length)place(row);return output}
function render(){if(!current)return;el('size').textContent=fmt(current.size);el('crumbs').innerHTML=history.map((n,i)=>`<button onclick="jump(${i})">${esc(n.name)}</button>${i<history.length-1?' › ':''}`).join('');const nodes=visibleNodes();el('resultCount').textContent=`${nodes.length} 项`;if(!nodes.length){el('tree').className='empty';el('tree').innerHTML='没有符合筛选条件的项目';return}const tree=el('tree');if(viewMode==='list')return renderList(tree,nodes);if(viewMode==='bars')return renderBars(tree,nodes);renderTreemap(tree,nodes)}
function nestedTiles(nodes,width,height,level,parentChain){const boxes=squarify(nodes,Math.max(width,1),Math.max(height,1));return boxes.map(({node:n,x,y,w,h})=>{nestedRendered++;const index=parentChain?nodes.indexOf(n):current.children.indexOf(n),chain=parentChain?parentChain+'.'+index:String(index),density=w<26||h<20?'tiny':w<85||h<48?'compact':'',color=tileColor(n),kind=nodeKind(n),maxDepth=treeDepth==='all'?12:Number(treeDepth),canExpand=kind==='folder'&&n.children?.length&&level<maxDepth&&w>92&&h>68&&nestedRendered<3000;if(canExpand){const children=n.children,innerW=Math.max(w-4,1),innerH=Math.max(h-31,1);return `<div class="tile folder folder-expanded" title="${esc(n.name)} · ${fmt(n.size)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><button class="tile-head" onclick="openNodeChain('${chain}')">${esc(n.name)} · ${fmt(n.size)}</button><div class="nested-area">${nestedTiles(children,innerW,innerH,level+1,chain)}</div></div>`}return `<button class="tile ${kind} ${density}" onclick="openNodeChain('${chain}')" title="${esc(n.name)} · ${fmt(n.size)}&#10;${esc(n.path)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:linear-gradient(145deg,${color},#172441)"><b>${esc(n.name)}</b><small>${fmt(n.size)}</small><em>${kind==='folder'?(n.children?.length||0)+' 项':esc(n.ext||'')}</em></button>`}).join('')}
function renderTreemap(tree,nodes){tree.className='treemap';tree.innerHTML='';nestedRendered=0;tree.innerHTML=nestedTiles(nodes,Math.max(tree.clientWidth,1),Math.max(tree.clientHeight,1),1,'');if(nestedRendered>=3000)tree.insertAdjacentHTML('beforeend','<span class="nested-limit">已显示最大的 3,000 项，点击矩形可继续查看</span>')}
function renderList(tree,nodes){tree.className='list-view';tree.innerHTML=nodes.map(n=>{const index=current.children.indexOf(n),kind=nodeKind(n),canOpen=kind==='folder'&&n.children?.length;return `<div class="list-row"><div class="list-name"><b>${kind==='folder'?'▸':'·'} ${esc(n.name)}</b><small title="${esc(n.path)}">${esc(n.path)}</small></div><span class="kind-pill">${kind==='folder'?'文件夹':esc(n.ext||'文件')}</span><strong>${fmt(n.size)}</strong><button class="enter-btn" ${canOpen?`onclick="openNodeAt(${index})"`:'disabled'}>${canOpen?'进入':'—'}</button></div>`}).join('')}
function renderBars(tree,nodes){tree.className='bars-view';const max=Math.max(...nodes.map(n=>n.size),1);tree.innerHTML=nodes.map(n=>{const index=current.children.indexOf(n),kind=nodeKind(n),canOpen=kind==='folder'&&n.children?.length,pct=n.size/max*100;return `<div class="bar-row"><button class="bar-label" ${canOpen?`onclick="openNodeAt(${index})"`:'disabled'} title="${esc(n.path)}">${kind==='folder'?'▸':'·'} ${esc(n.name)}</button><div class="bar-track"><i class="bar-fill" style="width:${pct}%;background:${tileColor(n)}"></i></div><b class="bar-size">${fmt(n.size)}</b></div>`}).join('')}
function openNodeAt(index){const n=current.children[index];if(!n||nodeKind(n)==='file'||!n.children?.length)return;current=n;history.push(n);el('search').value='';el('typeFilter').value='all';render()}
function openNodeChain(chain){let node=current;const entered=[];for(const part of chain.split('.')){const next=node.children?.[Number(part)];if(!next)break;node=next;if(nodeKind(node)==='folder')entered.push(node)}if(!entered.length||nodeKind(node)==='file'||!node.children?.length)return;current=node;history.push(...entered);el('search').value='';el('typeFilter').value='all';render()}
function setView(mode){viewMode=mode;['Treemap','List','Bars'].forEach(name=>el('view'+name).classList.toggle('active',name.toLowerCase()===mode));el('depthControls').style.display=mode==='treemap'?'flex':'none';render()}
function setTreeDepth(depth){treeDepth=depth;el('treeDepth').value=depth;if(viewMode!=='treemap')setView('treemap');else render();if(depth==='all')showToast('已展开所有当前可见层级；过小项目可点击放大继续查看')}
function jump(i){history=history.slice(0,i+1);current=history[i];render()}function toggleOrder(){ascending=!ascending;el('orderBtn').textContent=ascending?'升序 ↑':'降序 ↓';render()}
function renderSide(){el('types').innerHTML=result.types.map(t=>`<div class="type-row"><div><b>${esc(t.ext)}</b><small>${(t.size/result.root.size*100).toFixed(1)}%</small></div><b>${fmt(t.size)}</b></div>`).join('');el('largest').innerHTML=result.largest.slice(0,15).map(f=>`<div class="file-row"><div><b>${esc(f.name)}</b><small title="${esc(f.path)}">${esc(f.ext)}</small></div><b>${fmt(f.size)}</b></div>`).join('')}
let resizeTimer=null;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(current)render()},120)});
loadDrives();loadSnapshotList();
</script>
</body></html>
