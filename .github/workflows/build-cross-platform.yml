name: Build cross-platform releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag
        required: true
        default: v0.1.4

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.21.0"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Verify architecture and test
        shell: pwsh
        run: |
          python -c "import platform; assert platform.machine() in ('AMD64', 'x86_64'); print(platform.platform(), platform.machine())"
          python -m py_compile local_server.py
          python -m unittest discover -s tests -p "test_local_server.py" -v
          npm ci
          npm test
      - name: Build executable
        shell: pwsh
        run: |
          python -m pip install "pyinstaller==$env:PYINSTALLER_VERSION"
          python -m PyInstaller --clean --noconfirm --workpath build-pyinstaller SpaceLens.spec
          New-Item -ItemType Directory -Force release/SpaceLens-Windows-x64 | Out-Null
          Copy-Item dist/SpaceLens.exe release/SpaceLens-Windows-x64/
          Copy-Item 'packaging/windows/启动 SpaceLens.cmd' release/SpaceLens-Windows-x64/
          Copy-Item README.md,LICENSE release/SpaceLens-Windows-x64/
      - name: Smoke-test packaged program
        shell: pwsh
        run: |
          python tests/smoke_packaged.py release/SpaceLens-Windows-x64/SpaceLens.exe
          Compress-Archive -Path release/SpaceLens-Windows-x64 -DestinationPath release/SpaceLens-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceLens-Windows-x64
          path: release/SpaceLens-Windows-x64.zip
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64
      - name: Verify architecture and test
        shell: pwsh
        run: |
          python -c "import platform; assert platform.machine() == 'ARM64'; print(platform.platform(), platform.machine())"
          python -m py_compile local_server.py
          python -m unittest discover -s tests -p "test_local_server.py" -v
      - name: Build executable
        shell: pwsh
        run: |
          python -m pip install "pyinstaller==$env:PYINSTALLER_VERSION"
          python -m PyInstaller --clean --noconfirm --workpath build-pyinstaller SpaceLens.spec
          New-Item -ItemType Directory -Force release/SpaceLens-Windows-ARM64 | Out-Null
          Copy-Item dist/SpaceLens.exe release/SpaceLens-Windows-ARM64/
          Copy-Item 'packaging/windows/启动 SpaceLens.cmd' release/SpaceLens-Windows-ARM64/
          Copy-Item README.md,LICENSE release/SpaceLens-Windows-ARM64/
      - name: Smoke-test packaged program
        shell: pwsh
        run: |
          python tests/smoke_packaged.py release/SpaceLens-Windows-ARM64/SpaceLens.exe
          Compress-Archive -Path release/SpaceLens-Windows-ARM64 -DestinationPath release/SpaceLens-Windows-ARM64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceLens-Windows-ARM64
          path: release/SpaceLens-Windows-ARM64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64
      - name: Verify architecture and test
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          bash -n packaging/macos/SpaceLens-launcher
          python -c "import platform; assert platform.machine() == 'arm64'; print(platform.platform(), platform.machine())"
          python -m py_compile local_server.py
          python -m unittest discover -s tests -p "test_local_server.py" -v
      - name: Build executable
        shell: bash
        run: |
          python -m pip install "pyinstaller==$PYINSTALLER_VERSION"
          python -m PyInstaller --clean --noconfirm --workpath build-pyinstaller SpaceLens.spec
          file dist/SpaceLens | tee /tmp/spacelens-file.txt
          grep -q "arm64" /tmp/spacelens-file.txt
          app="release/SpaceLens.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          iconset="release/SpaceLens.iconset"
          mkdir -p "$iconset"
          sips -z 16 16 packaging/icons/SpaceLens.png --out "$iconset/icon_16x16.png"
          sips -z 32 32 packaging/icons/SpaceLens.png --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 packaging/icons/SpaceLens.png --out "$iconset/icon_32x32.png"
          sips -z 64 64 packaging/icons/SpaceLens.png --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 packaging/icons/SpaceLens.png --out "$iconset/icon_128x128.png"
          sips -z 256 256 packaging/icons/SpaceLens.png --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 packaging/icons/SpaceLens.png --out "$iconset/icon_256x256.png"
          sips -z 512 512 packaging/icons/SpaceLens.png --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 packaging/icons/SpaceLens.png --out "$iconset/icon_512x512.png"
          cp packaging/icons/SpaceLens.png "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/SpaceLens.icns"
          cp dist/SpaceLens "$app/Contents/MacOS/SpaceLens-bin"
          cp packaging/macos/SpaceLens-launcher "$app/Contents/MacOS/SpaceLens"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp README.md MACOS.md LICENSE "$app/Contents/Resources/"
          chmod +x "$app/Contents/MacOS/SpaceLens" "$app/Contents/MacOS/SpaceLens-bin"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Smoke-test packaged program
        shell: bash
        run: |
          executable="release/SpaceLens.app/Contents/MacOS/SpaceLens-bin"
          file "$executable" | tee /tmp/spacelens-app-file.txt
          grep -q "arm64" /tmp/spacelens-app-file.txt
          python tests/smoke_packaged.py "$executable"
      - name: Create and verify DMG
        shell: bash
        run: |
          mkdir -p release/dmg-root
          ditto release/SpaceLens.app release/dmg-root/SpaceLens.app
          ln -s /Applications release/dmg-root/Applications
          hdiutil create \
            -volname "SpaceLens" \
            -srcfolder release/dmg-root \
            -ov \
            -format UDZO \
            release/SpaceLens-macOS-ARM64.dmg
          mkdir -p /tmp/spacelens-dmg
          hdiutil attach -nobrowse -readonly \
            -mountpoint /tmp/spacelens-dmg \
            release/SpaceLens-macOS-ARM64.dmg
          test -x /tmp/spacelens-dmg/SpaceLens.app/Contents/MacOS/SpaceLens
          test -x /tmp/spacelens-dmg/SpaceLens.app/Contents/MacOS/SpaceLens-bin
          test -L /tmp/spacelens-dmg/Applications
          file /tmp/spacelens-dmg/SpaceLens.app/Contents/MacOS/SpaceLens-bin | grep -q "arm64"
          hdiutil detach /tmp/spacelens-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceLens-macOS-ARM64
          path: release/SpaceLens-macOS-ARM64.dmg
          if-no-files-found: error

  publish-release:
    name: Publish direct downloads
    runs-on: ubuntu-latest
    needs: [windows-x64, windows-arm64, macos-arm64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: SpaceLens-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          ls -lh release-assets
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            cat > /tmp/spacelens-release-notes.md <<'EOF'
          Windows x64, Windows ARM64, and macOS Apple Silicon packages are available below. macOS users can download the DMG directly.

          All builds are produced by GitHub Actions. SpaceLens runs locally and does not upload scan results, file paths, or disk information.

          ---

          Windows x64、Windows ARM64 与 macOS Apple Silicon 安装包见下方。macOS 用户可以直接下载 DMG。

          所有安装包均由 GitHub Actions 构建。SpaceLens 完全在本机运行，不会上传扫描结果、文件路径或磁盘信息。
          EOF
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "SpaceLens ${RELEASE_TAG}" \
              --notes-file /tmp/spacelens-release-notes.md
          fi
